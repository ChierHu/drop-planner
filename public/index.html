<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Drop Planner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="wordmark">
        <span class="mark">Drop Planner</span>
        <span class="tagline">Autonomous merchandising agent · ZooWork Managed Agents</span>
      </div>
      <div class="top-actions">
        <span class="agent-info" id="agent-info"></span>
        <button id="new-btn" type="button">+ New drop</button>
      </div>
    </header>
    <main class="layout">
      <aside class="rail">
        <p class="rail-title">Drops</p>
        <ul id="run-list" class="run-list"></ul>
      </aside>
      <section id="board" class="board"></section>
    </main>

    <dialog id="new-drop" class="modal">
      <form id="brief-form" method="dialog" autocomplete="off">
        <div class="modal-head">
          <h2>New drop</h2>
          <button type="button" class="icon-btn" id="close-modal" aria-label="Close">✕</button>
        </div>
        <label class="field"
          >Shopify store<input name="storeUrl" required value="girlfriend.com"
        /></label>
        <div class="row2">
          <label class="field">Launch date<input name="launchDate" type="date" required /></label>
          <label class="field"
            >Open-to-buy<span class="prefix"
              ><i>$</i
              ><input
                name="budget"
                type="number"
                min="1000"
                step="500"
                value="60000"
                required /></span
          ></label>
        </div>
        <div class="row2">
          <label class="field"
            >Margin target <b id="margin-out">68%</b
            ><input name="targetMarginPct" type="range" min="40" max="85" value="68"
          /></label>
          <label class="field"
            >Styles <b id="styles-out">6</b
            ><input name="skuCount" type="range" min="3" max="10" value="6"
          /></label>
        </div>
        <div class="toggles">
          <label class="toggle"
            ><input type="checkbox" name="autoApprove" /><span
              >Auto-approve within policy</span
            ></label
          >
          <label class="toggle"
            ><input type="checkbox" name="weeklyWatch" checked /><span
              >Weekly Drop Watch</span
            ></label
          >
          <label class="toggle"
            ><input type="checkbox" name="makeTeaserVideo" /><span>Seedance teaser</span></label
          >
        </div>
        <details class="more">
          <summary>More options</summary>
          <div class="row2">
            <label class="field"
              >Brand name<input name="brandName" value="Girlfriend Collective"
            /></label>
            <label class="field"
              >Theme<input name="dropTheme" value="Spring 2027 outdoor-to-studio capsule"
            /></label>
          </div>
          <div class="row3">
            <label class="field"
              >MOQ / style<input name="minUnitsPerStyle" type="number" min="1" value="150"
            /></label>
            <label class="field"
              >Sell-through %<input
                name="sellThroughPct"
                type="number"
                min="20"
                max="100"
                value="65"
            /></label>
            <label class="field"
              >Markdown %<input name="markdownPct" type="number" min="0" max="90" value="40"
            /></label>
          </div>
          <label class="field"
            >Notes for the agent<textarea
              name="notes"
              rows="2"
              placeholder="e.g. no denim, push extended sizes"
            ></textarea>
          </label>
        </details>
        <p class="form-error" id="form-error" hidden></p>
        <div class="modal-actions">
          <button type="button" class="ghost" id="cancel-modal">Cancel</button>
          <button type="submit" id="start-btn">Plan the drop →</button>
        </div>
      </form>
    </dialog>

    <div id="tip" class="tip" hidden></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
